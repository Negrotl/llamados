const TIPOS = {"completa": "💼 Jornada completa", "part_time": "🕐 Part-time", "directivo": "🧭 Cargos directivos", "postdoc": "🎓 Postdoctorados", "cfp_congreso": "🎤 Congresos y llamados a ponencias", "cfp_revista": "📚 Convocatorias de revistas", "fondo_beca": "💰 Fondos, becas y estancias"};
// Fecha de quien visita la página: los días restantes y los vencidos se calculan en vivo.
const HOY = new Date(); HOY.setHours(0, 0, 0, 0);
const $ = id => document.getElementById(id);
const norm = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dias = iso => iso ? Math.round((new Date(iso + "T00:00:00") - HOY) / 864e5) : Infinity;

function card(it) {
  const d = dias(it.cierre);
  const lugar = [it.institucion, it.unidad, it.ciudad, it.jornada].filter(Boolean).join(" · ");
  const etq = [`<span class="tipo">${esc(TIPOS[it.tipo])}</span>`]
    .concat(it.region && it.region !== "Sin región indicada" ? [`<span>📍 ${esc(it.region)}</span>`] : [])
    .concat(it.areas.map(a => `<span>${esc(a)}</span>`)).join("");
  const cierre = it.cierre ? `Cierre: ${esc(it.cierre_txt)}${d <= 7 ? (d === 0 ? " · ¡hoy!" : ` · quedan ${d} días`) : ""}` : "Cierre: no indicado";
  return `<article class="card${d <= 7 ? " urgente" : ""}">
    <div class="etq">${etq}</div>
    <h2><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.titulo)}</a></h2>
    <div class="lugar">${esc(lugar)}</div>
    <p class="res">${esc(it.resumen)}</p>
    <div class="cierre">${cierre}</div></article>`;
}

const VIGENTES = ITEMS.filter(it => dias(it.cierre) >= 0);

function filtrar() {
  const q = norm($("q").value), area = $("area").value, region = $("region").value,
        tipo = $("tipo").value, plazo = parseInt($("plazo").value || "0");
  const res = VIGENTES.filter(it =>
    (!area || it.areas.includes(area)) && (!region || it.region === region) &&
    (!tipo || it.tipo === tipo) && (!plazo || dias(it.cierre) <= plazo) &&
    (!q || norm([it.titulo, it.institucion, it.unidad, it.ciudad, it.resumen, it.areas.join(" ")].join(" ")).includes(q)));
  $("lista").innerHTML = res.length ? res.map(card).join("") :
    '<p class="vacio">No hay oportunidades con estos filtros. Prueba quitando alguno.</p>';
  $("n").textContent = `${res.length} de ${VIGENTES.length} oportunidades`;
  const p = new URLSearchParams();
  for (const k of ["q", "area", "region", "tipo", "plazo"]) if ($(k).value) p.set(k, $(k).value);
  history.replaceState(null, "", p.toString() ? "?" + p : location.pathname);
}

// Los filtros quedan en la URL: se pueden compartir enlaces como ?area=Derecho&region=Biobío
const ini = new URLSearchParams(location.search);
for (const k of ["q", "area", "region", "tipo", "plazo"]) if (ini.get(k)) $(k).value = ini.get(k);
for (const k of ["q", "area", "region", "tipo", "plazo"]) $(k).addEventListener("input", filtrar);
$("limpiar").addEventListener("click", () => { for (const k of ["q", "area", "region", "tipo", "plazo"]) $(k).value = ""; filtrar(); });
filtrar();
</script>
