const dias = iso => iso ? Math.round((new Date(iso + "T00:00:00") - HOY) / 864e5) : Infinity;

function card(it) {
  const d = dias(it.cierre);
  const lugar = [it.institucion, it.unidad, it.ciudad, it.jornada].filter(Boolean).join(" · ");
  const etq = [`<span class="tipo">${esc(TIPOS[it.tipo])}</span>`]
    .concat(it.region && it.region !== "Sin región indicada" ? [`<span>📍 ${esc(it.region)}</span>`] : [])
    .concat(it.areas.map(a => `<span>${esc(a)}</span>`)).join("");
  // La fecha de cierre va en un bloque propio a la izquierda: es lo primero que se lee.
  let fecha;
  if (it.cierre) {
    const f = new Date(it.cierre + "T00:00:00");
    const mes = f.toLocaleDateString("es-CL", {month: "short"}).replace(".", "");
    const resta = d === 0 ? "¡cierra hoy!" : d === 1 ? "queda 1 día" : `quedan ${d} días`;
    fecha = `<div class="fecha" title="Cierre: ${esc(it.cierre_txt)}"><div class="dia">${f.getDate()}</div>

  } else {
    fecha = '<div class="fecha sin"><div class="dia">Sin fecha</div><div class="resta">ver bases</div></div>';
  }
  return `<article class="card${d <= 7 ? " urgente" : ""}">${fecha}
    <div class="cuerpo">
      <h2><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.titulo)}</a></h2>

}

function filtrar() {

const ini = new URLSearchParams(location.search);
for (const k of ["q", "area", "region", "tipo", "grado", "plazo"]) if (ini.get(k)) $(k).value = ini.get(k);
for (const k of ["q", "area", "region", "tipo", "grado", "plazo"]) $(k).addEventListener("input", filtrar);
$("limpiar").addEventListener("click", () => { for (const k of ["q", "area", "region", "tipo", "grado", "plazo"]) $(k).value = ""; filtrar(); });
filtrar();
</script>
